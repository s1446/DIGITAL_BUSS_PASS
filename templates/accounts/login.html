<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 20px;
        }

        .login-container {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            border-top: 5px solid #b30000;
        }

        h2 {
            text-align: center;
            color: #b30000;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            margin-top: 15px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        input:focus {
            border-color: #b30000;
        }

        .login-btn {
            width: 100%;
            margin-top: 30px;
            background: #b30000;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .login-btn:hover {
            background: #8f0000;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-eye {
            position: absolute;
            right: 12px;
            top: 12px;
            cursor: pointer;
        }

        small {
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="login-container">

    <h2>Student Login</h2>
    <p class="subtitle">
        Login to access your APSRTC Digital Bus Pass account
    </p>

    <!-- MESSAGES -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert 
                {% if message.tags == 'error' %}
                    alert-danger
                {% else %}
                    alert-success
                {% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <!-- USERNAME -->
        <label>Username</label>
        <input
            type="text"
            name="username"
            placeholder="Enter your username"
            required
        >
        <small>Enter your registered username</small>

        <!-- PASSWORD -->
        <label>Password</label>
        <div class="password-wrapper">
            <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter your password"
                required
            >
            <span class="toggle-eye" onclick="togglePassword()">👁️</span>
        </div>
        <small>Keep your password secure</small>

        <button type="submit" class="login-btn">
            Login
        </button>
    </form>

    <div class="register-link">
        <a href="{% url 'register' %}">
            Create Account
        </a>
    </div>

</div>

<script>
function togglePassword() {
    const field = document.getElementById("password");
    field.type = field.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
