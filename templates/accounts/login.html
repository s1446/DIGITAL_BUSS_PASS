<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f4f6f9;
    font-family: 'Segoe UI', sans-serif;
}

.login-container {
    max-width: 500px;
    margin: 60px auto;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.title {
    text-align: center;
    color: #b30000;
    font-weight: bold;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
    font-size: 14px;
}

/* INPUT GROUP */
.form-group {
    margin-bottom: 18px;
}

.form-control {
    border-radius: 8px;
    padding: 12px;
}

/* PASSWORD */
.password-wrapper {
    position: relative;
}

.toggle-eye {
    position: absolute;
    right: 12px;
    top: 12px;
    cursor: pointer;
}

/* BUTTON */
.login-btn {
    width: 100%;
    background: #b30000;
    color: white;
    padding: 13px;
    border-radius: 8px;
    font-weight: bold;
    border: none;
}

.login-btn:hover {
    background: #8f0000;
}

/* LINKS */
.register-link {
    text-align: center;
    margin-top: 20px;
}

.register-link a {
    color: #b30000;
    font-weight: 600;
    text-decoration: none;
}

</style>
</head>

<body>

<div class="login-container">

    <h3 class="title">Welcome Back</h3>
    <p class="subtitle">APSRTC Digital Bus Pass Login</p>

    <!-- MESSAGES -->
  

    <form method="POST">
        {% csrf_token %}

        <!-- USERNAME -->
        <div class="form-group">
            <label>Username</label>
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter your username"
                   required>
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
            <label>Password</label>
            <div class="password-wrapper">
                <input type="password"
                       name="password"
                       id="password"
                       class="form-control"
                       placeholder="Enter your password"
                       required>

                <span class="toggle-eye" onclick="togglePassword()">👁️</span>
            </div>
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>
    </form>

    <div class="register-link">
        Don’t have an account?
        <a href="{% url 'register' %}">Create Account</a>
    </div>

</div>

<script>
function togglePassword() {
    let field = document.getElementById("password");
    field.type = field.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
