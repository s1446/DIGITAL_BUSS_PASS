<!-- templates/payments/desktop_payment.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Payment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .main-box {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 45px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            border-top: 5px solid #b30000;
            text-align: center;
        }

        h2 {
            color: #b30000;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .sub-text {
            color: #555;
            margin-bottom: 35px;
            font-size: 15px;
        }

        .amount-box {
            background: #fff8f8;
            border-left: 5px solid #b30000;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 35px;
            text-align: left;
        }

        .amount-box p {
            margin: 14px 0;
            font-size: 16px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .amount-box strong {
            display: inline-block;
            width: 180px;
            color: #222;
        }

        .payment-method {
            font-weight: 500;
            color: #555;
        }

        .confirm-btn {
            width: 100%;
            background: #b30000;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .confirm-btn:hover {
            background: #8f0000;
        }

        .back-btn {
            width: 100%;
            display: block;
            margin-top: 15px;
            background: #333;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #111;
            color: white;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .main-box {
                padding: 25px;
                margin: 20px auto;
            }

            h2 {
                font-size: 24px;
            }

            .sub-text {
                font-size: 14px;
            }

            .amount-box strong {
                display: block;
                width: 100%;
                margin-bottom: 5px;
            }

            .confirm-btn,
            .back-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="main-box">

    <h2>Complete Your Payment</h2>

    <p class="sub-text">
        Review your selected plan and confirm payment to generate
        your final digital bus pass.
    </p>

    <div class="amount-box">

        <p>
            <strong>Selected Plan:</strong>
            {{ selected_plan }}
        </p>

        <p>
            <strong>Amount to Pay:</strong>
            ₹{{ amount }}
        </p>

        <p>
            <strong>Payment Method:</strong>
            <span class="payment-method">
                UPI / Debit Card / Credit Card / Net Banking
            </span>
        </p>

    </div>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="confirm-btn">
            Complete Payment
        </button>
    </form>

    <a href="{% url 'select_plan' %}" class="back-btn">
        Back to Select Plan
    </a>

</div>

</body>
</html>
