<!-- templates/payments/payment_gateway.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .main-box {
            max-width: 750px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            border-top: 5px solid #b30000;
        }

        h2 {
            text-align: center;
            color: #b30000;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
            font-size: 15px;
        }

        /* Step Indicator */

        .steps-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .step-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ddd;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .step-title {
            margin-top: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .step-line {
            width: 70px;
            height: 4px;
            background: #ddd;
            margin-bottom: 28px;
        }

        .step.active .step-circle {
            background: #b30000;
            color: white;
        }

        .step.active .step-title {
            color: #b30000;
        }

        .payment-box {
            background: #fff8f8;
            border-left: 5px solid #b30000;
            padding: 30px;
            border-radius: 12px;
        }

        .payment-row {
            margin-bottom: 18px;
            font-size: 16px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }

        .payment-row strong {
            display: inline-block;
            width: 200px;
            color: #222;
        }

        .payment-method {
            color: #555;
            font-weight: 500;
        }

        .pay-btn {
            width: 100%;
            margin-top: 30px;
            background: #b30000;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .pay-btn:hover {
            background: #8f0000;
        }

        .back-btn {
            width: 100%;
            display: block;
            margin-top: 15px;
            background: #333;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #111;
            color: white;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .main-box {
                padding: 25px;
                margin: 20px auto;
            }

            h2 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            .step-line {
                width: 40px;
            }

            .step-title {
                font-size: 12px;
            }

            .payment-row strong {
                display: block;
                width: 100%;
                margin-bottom: 5px;
            }

            .pay-btn,
            .back-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="main-box">

    <div class="steps-wrapper">

        <div class="step active">
            <div class="step-circle">1</div>
            <div class="step-title">Approval ID</div>
        </div>

        <div class="step-line"></div>

        <div class="step active">
            <div class="step-circle">2</div>
            <div class="step-title">Select Plan</div>
        </div>

        <div class="step-line"></div>

        <div class="step active">
            <div class="step-circle">3</div>
            <div class="step-title">Payment</div>
        </div>

        <div class="step-line"></div>

        <div class="step">
            <div class="step-circle">4</div>
            <div class="step-title">Final Pass</div>
        </div>

    </div>

    <h2>Payment Gateway</h2>

    <p class="subtitle">
        Review your selected plan and complete payment securely
    </p>

    <div class="payment-box">

        <div class="payment-row">
            <strong>Selected Plan:</strong>
            {{ selected_plan }}
        </div>

        <div class="payment-row">
            <strong>Amount:</strong>
            ₹{{ amount }}
        </div>

        <div class="payment-row">
            <strong>Payment Method:</strong>
            <span class="payment-method">
                UPI / Debit Card / Credit Card / Net Banking
            </span>
        </div>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="pay-btn">
                Complete Payment
            </button>
        </form>

        <a href="{% url 'select_plan' %}" class="back-btn">
            Back to Select Plan
        </a>

    </div>

</div>

</body>
</html>
