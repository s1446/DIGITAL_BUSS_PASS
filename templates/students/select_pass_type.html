<!-- templates/students/select_pass_type.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Pass Type</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .header {
            background: #b30000;
            color: white;
            padding: 18px;
            text-align: center;
            font-weight: bold;
            font-size: 28px;
        }

        .main-box {
            background: white;
            margin-top: 40px;
            margin-bottom: 40px;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }

        .title {
            text-align: center;
            color: #b30000;
            font-weight: bold;
            margin-bottom: 35px;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
            font-size: 16px;
        }

        .type-btn {
            width: 100%;
            padding: 16px;
            margin-bottom: 18px;
            border: 1px solid #b30000;
            color: #b30000;
            background: white;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            display: block;
            text-align: center;
            font-size: 16px;
            transition: 0.3s;
        }

        .type-btn:hover {
            background: #b30000;
            color: white;
            transform: translateY(-2px);
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #111;
            color: white;
        }

        .center-box {
            text-align: center;
        }

        @media (max-width: 768px) {
            .header {
                font-size: 22px;
                padding: 15px;
            }

            .main-box {
                padding: 25px;
                margin-top: 20px;
                margin-bottom: 20px;
            }

            .title {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            .type-btn {
                padding: 14px;
                font-size: 15px;
            }

            .back-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="header">
    Andhra Pradesh State Road Transport Corporation
</div>

<div class="container">

    <div class="main-box">

        <h2 class="title">Select Pass Category</h2>

        <p class="subtitle">
            Choose the appropriate category to apply for your digital bus pass
        </p>

        <a href="{% url 'apply_bus_pass' %}" class="type-btn">
            Student
        </a>

        <a href="{% url 'government_employee_apply' %}" class="type-btn">
            Government Employee
        </a>

        <a href="{% url 'non_government_employee_apply' %}" class="type-btn">
            Non-Government Employee
        </a>

        <a href="{% url 'citizen_apply' %}" class="type-btn">
            Citizen
        </a>

        <a href="{% url 'pwd_apply' %}" class="type-btn">
            PWD
        </a>

        <div class="center-box">
            <a href="{% url 'student_dashboard' %}" class="back-btn">
                Back to Dashboard
            </a>
        </div>

    </div>

</div>

</body>
</html>
