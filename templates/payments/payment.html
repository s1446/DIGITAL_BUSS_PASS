<!-- templates/payments/payment.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Pass Payment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            background: #b30000;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        .main-box {
            background: white;
            max-width: 650px;
            margin: 40px auto;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            border-top: 5px solid #b30000;
        }

        h2 {
            color: #b30000;
            text-align: center;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
            font-size: 15px;
        }

        /* Step Indicator */

        .steps-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0 40px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .step-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ddd;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .step-title {
            margin-top: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .step-line {
            width: 70px;
            height: 4px;
            background: #ddd;
            margin-bottom: 28px;
        }

        .step.active .step-circle {
            background: #b30000;
            color: white;
        }

        .step.active .step-title {
            color: #b30000;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 22px;
            font-size: 15px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #b30000;
            outline: none;
        }

        .verify-btn {
            width: 100%;
            background: #b30000;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .verify-btn:hover {
            background: #8f0000;
        }

        .back-btn {
            width: 100%;
            display: block;
            margin-top: 15px;
            background: #333;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #111;
            color: white;
        }

        .message-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background: #fff8f8;
            border-left: 5px solid #b30000;
            font-weight: 600;
            color: #333;
            text-align: center;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header {
                font-size: 22px;
                padding: 15px;
            }

            .main-box {
                padding: 25px;
                margin: 20px auto;
            }

            h2 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            .step-line {
                width: 40px;
            }

            .step-title {
                font-size: 12px;
            }

            .verify-btn,
            .back-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="header">
    Andhra Pradesh State Road Transport Corporation
</div>

<div class="steps-wrapper">

    <div class="step active">
        <div class="step-circle">1</div>
        <div class="step-title">Approval ID</div>
    </div>

    <div class="step-line"></div>

    <div class="step">
        <div class="step-circle">2</div>
        <div class="step-title">Select Plan</div>
    </div>

    <div class="step-line"></div>

    <div class="step">
        <div class="step-circle">3</div>
        <div class="step-title">Payment</div>
    </div>

    <div class="step-line"></div>

    <div class="step">
        <div class="step-circle">4</div>
        <div class="step-title">Final Pass</div>
    </div>

</div>

<div class="main-box">

    <h2>Bus Pass Payment</h2>

    <p class="subtitle">
        Enter your approved Application ID to continue payment
    </p>

    <form method="POST">
        {% csrf_token %}

        <label for="approval_id">
            Enter Approval ID
        </label>

        <input
            type="text"
            name="approval_id"
            id="approval_id"
            placeholder="Enter your Approval ID"
            required
        >

        <button type="submit" class="verify-btn">
            Verify & Continue
        </button>
    </form>

    <a href="{% url 'student_dashboard' %}" class="back-btn">
        Back to Dashboard
    </a>

    {% if message %}
        <div class="message-box">
            {{ message }}
        </div>
    {% endif %}

</div>

</body>
</html>
