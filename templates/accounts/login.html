<!-- templates/accounts/login.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .login-container {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            border-top: 5px solid #b30000;
        }

        h2 {
            text-align: center;
            color: #b30000;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-top: 18px;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #b30000;
        }

        .login-btn {
            width: 100%;
            margin-top: 35px;
            background: #b30000;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #8f0000;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
        }

        .register-link a {
            color: #b30000;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .alert {
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .login-container {
                padding: 25px;
                margin: 20px auto;
            }

            h2 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            input {
                padding: 10px;
                font-size: 14px;
            }

            .login-btn {
                padding: 12px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">

    <h2>Student Login</h2>

    <p class="subtitle">
        Login to access your APSRTC Digital Bus Pass account
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert
                {% if message.tags == 'error' %}
                    alert-danger
                {% else %}
                    alert-success
                {% endif %}
                alert-dismissible fade show"
                role="alert">

                {{ message }}

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close">
                </button>

            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input
            type="text"
            name="username"
            placeholder="Enter your username"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit" class="login-btn">
            Login
        </button>
    </form>

    <div class="register-link">
        <a href="{% url 'register' %}">
            Create Account
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
